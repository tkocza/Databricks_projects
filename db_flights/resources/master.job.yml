resources:
  jobs:
    master_pipeline:
      name: Master - Flights Pipeline

      tasks:
        - task_key: bronze

          run_job_task:
            job_id: ${resources.jobs.bronze_kaggle.id}

        - task_key: silver

          depends_on:
            - task_key: bronze

          run_job_task:
            job_id: ${resources.jobs.flights_silver.id}

        - task_key: gold_init

          depends_on:
            - task_key: silver

          run_job_task:
            job_id: ${resources.jobs.flights_gold_init.id}

        - task_key: gold

          depends_on:
            - task_key: gold_init

          run_job_task:
            job_id: ${resources.jobs.flights_gold.id}
