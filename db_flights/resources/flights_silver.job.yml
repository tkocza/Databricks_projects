resources:
  jobs:
    flights_silver:
      name: Flights - Silver

      tasks:
        - task_key: airlines

          python_wheel_task:
            package_name: db_flights
            entry_point: silver_airlines

          environment_key: default

        - task_key: airports

          python_wheel_task:
            package_name: db_flights
            entry_point: silver_airports

          environment_key: default

        - task_key: flights

          python_wheel_task:
            package_name: db_flights
            entry_point: silver_flights

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl