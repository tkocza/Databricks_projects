[project]
name = "db_flights_lakeflow"
version = "0.0.1"
authors = [{ name = "tkocza" }]
description = "Metadata-driven ETL pipeline built with Databricks Asset Bundles and PySpark"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

#  explicitly defines the package included in the wheel
[tool.hatch.build.targets.wheel]
packages = ["src/db_flights_lakeflow"]

# [project.scripts]
# main = "db_flights_lakeflow_lakeflow.main:main"

[project.scripts]
# entry points

# bronze
# bronze_kaggle = "db_flights_lakeflow.bronze.bronze_kaggle:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120